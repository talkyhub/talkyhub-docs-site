# Container-internal nginx: serves the static Docusaurus build. TLS + security headers are handled by the HOST
# nginx (deploy/nginx/docs.talkyhub.ru.conf) in front of this container, so keep this minimal.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (images/fonts are already compressed).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Fingerprinted build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Clean URLs: Docusaurus builds <route>/index.html (trailingSlash: true). A miss returns a real 404 status
    # (=404), which error_page then renders with Docusaurus's own 404.html — not a 200 masquerading as found.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
