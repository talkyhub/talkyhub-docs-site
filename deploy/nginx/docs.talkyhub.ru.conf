# TalkyHub docs — host nginx for docs.talkyhub.ru.
#
# EXACT server_name so it wins over the `*.talkyhub.ru` wildcard in the landing's talkyhub.ru.conf (nginx
# prefers exact matches), otherwise docs.talkyhub.ru would be served by the landing container. Terminates TLS
# with the *.talkyhub.ru wildcard cert (already covers this subdomain — no new cert needed) and reverse-proxies
# to the docs container (docker-compose.yml -> 127.0.0.1:8083).
#
# Docs are PUBLIC reference material and WANT to be indexed, so — unlike api/app — no X-Robots-Tag/AI-bot
# blocking here (matches the landing).
#
# Install: copy to /etc/nginx/sites-available/docs.talkyhub.ru.conf, symlink into sites-enabled/, then
# `nginx -t && systemctl reload nginx`.

# HTTP :80 — ACME http-01 challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name docs.talkyhub.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS :443 — reverse proxy to the docs container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.talkyhub.ru;

    ssl_certificate     /etc/ssl/talkyhub.ru.pem;
    ssl_certificate_key /etc/ssl/talkyhub.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Static site → buffered proxy + keep-alive to the upstream are fine.
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
